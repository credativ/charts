---
name: Helm Chart Release

on:  # yamllint disable-line rule:truthy
  push:
    tags:
      - '*-[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      REGISTRY: ghcr.io
      CHARTS_DIR: charts

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract chart name and version from tag
        id: extract
        run: |
          TAG=${GITHUB_REF_NAME}
          CHART_NAME=${TAG%-*}
          CHART_VERSION=${TAG##*-}
          echo "chart_name=$CHART_NAME" >> $GITHUB_OUTPUT
          echo "chart_version=$CHART_VERSION" >> $GITHUB_OUTPUT

      - name: Setup Helm
        uses: azure/setup-helm@v5

      - name: Login to OCI registry
        # yamllint disable-line rule:line-length
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Sets version from tag in Chart.yaml
        run: |
          CHART_PATH=${{ env.CHARTS_DIR }}/${{ steps.extract.outputs.chart_name }}
          yq eval ".version = \"${{ steps.extract.outputs.chart_version }}\"" -i "$CHART_PATH/Chart.yaml"

      - name: Package and push Helm chart
        run: |
          CHART_PATH=${{ env.CHARTS_DIR }}/${{ steps.extract.outputs.chart_name }}
          helm dependency update "$CHART_PATH"
          helm package "$CHART_PATH"
          helm push "${{ steps.extract.outputs.chart_name }}-${{ steps.extract.outputs.chart_version }}.tgz" \
            oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ steps.extract.outputs.chart_name }} ${{ steps.extract.outputs.chart_version }}"
          tag_name: ${{ github.ref_name }}
          files: "${{ steps.extract.outputs.chart_name }}-${{ steps.extract.outputs.chart_version }}.tgz"
