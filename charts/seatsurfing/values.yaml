images:
  repository: seatsurfing
  pullPolicy: IfNotPresent
  name: backend
  tag: ""
  # Only needed as initContainer if using cert-manager for creating JWT Token
  openssl:
    repository: alpine
    name: openssl
    # renovate: datasource=docker packageName=alpine/openssl
    tag: 3.5.8

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagesPullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  containerPort: 8080
  annotations: {}

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    cpu: 200m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
#   - name: foo
#     mountPath: "/etc/foo"
#     readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

seatsurfing:
  # Use existing secret, provide a value or cryptKey is disabled.
  # It must not be changed after first start!
  cryptKey:
    existingSecret: false
    secretName: ""
    secretKey: ""
    value: ""
  organisation:
    init:
      name: Sample Company
      domain: seatsurfing.local
      username: admin
      password: "12345678"
      language: en
    signup:
      enabled: "0"
      # Should be your email domain, if using Entra ID you are only able to use accounts from this domain
      domain: ".on.seatsurfing.local"
      admin: admin
      maxUsers: "50"
      delete: "0"
  # Chose cert-manager or existing secret, otherwise seatsurfing is generating a JWT at every start.
  # cert-manager is highly recommended
  jwt:
    certManager:
      enabled: false
      duration: 8760h
      privateKey:
        algorithm: RSA
        size: 4096
    existingSecret:
      enabled: false
      secretName: ""
      secretPrivateKey: ""
      secretPublicKey: ""
  loginProtection:
    maxFails: "10"
    slidingWindowSeconds: "600"
    banMinutes: "5"
  smtp:
    enabled: false
    host: ""
    port: "0"
    auth: "0"
    username: ""
    password:
      existingSecret: false
      secretName: ""
      secretKey: ""
      value: ""
    starttls: "0"
    sender_address: ""
  postgresql:
    # If there exists a secret having the connection string for pgsql,
    # it can be used directly, e.g. if provided by cnpg.
    connectionString:
      existingSecret: false
      secretName: ""
      secretKey: ""
    # If we don't use a existing connection string, we need to set
    # hostname, username, password and database
    hostname: ""
    username: ""
    password:
      existingSecret: false
      secretName: ""
      secretKey: ""
      # If not using an existing secret, the password must be set here
      value: ""
    database: ""
