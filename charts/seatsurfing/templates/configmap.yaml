---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "seatsurfing.fullname" . }}
  labels:
    {{- include "seatsurfing.labels" . | nindent 4 }}
data:
  {{- if .Values.seatsurfing.jwt.certManager.enabled }}
  JWT_PRIVATE_KEY: "/run/jwt-private-key/tls.key"
  JWT_PUBLIC_KEY: "/run/jwt-public-key/tls.key"
  {{- end }}
  {{- with .Values.seatsurfing.organisation }}
  INIT_ORG_NAME: {{ .init.name }}
  INIT_ORG_DOMAIN: {{ .init.domain }}
  INIT_ORG_USER: {{ .init.username }}
  INIT_ORG_PASS: "{{ .init.password }}"
  INIT_ORG_LANGUAGE: {{ .init.language }}
  ORG_SIGNUP_ENABLED: "{{ .signup.enabled }}"
  ORG_SIGNUP_DOMAIN: {{ .signup.domain }}
  ORG_SIGNUP_ADMIN: {{ .signup.admin }}
  ORG_SIGNUP_MAX_USERS: "{{ .signup.maxUsers }}"
  ORG_SIGNUP_DELETE: "{{ .signup.delete }}"
  {{- end }}
  {{- with .Values.seatsurfing.loginProtection }}
  LOGIN_PROTECTION_MAX_FAILS: "{{ .maxFails }}"
  LOGIN_PROTECTION_SLIDING_WINDOW_SECONDS: "{{ .slidingWindowSeconds }}"
  LOGIN_PROTECTION_BAN_MINUTES: "{{ .banMinutes }}"
  {{- end }}
  {{- if .Values.seatsurfing.smtp.enabled }}
  {{- with .Values.seatsurfing.smtp }}
  SMTP_HOST: {{ .host }}
  SMTP_PORT: "{{ .port }}"
  SMTP_START_TLS: "{{ .starttls }}"
  SMTP_AUTH: "{{ .auth }}"
  SMTP_AUTH_USER: "{{ .username }}"
  SMTP_SENDER_ADDRESS: {{ .sender_address }}
  {{- end }}
  {{- end }}
