---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "seatsurfing.fullname" . }}
  labels:
    {{- include "seatsurfing.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.containerPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "seatsurfing.selectorLabels" . | nindent 4 }}
